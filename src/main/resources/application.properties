spring.application.name=rating-system

# =======================
# DATABASE (DEFAULTS)
# =======================
spring.datasource.url=jdbc:mysql://localhost:3306/rating_system?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456   # default placeholder

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =======================
# JWT CONFIG
# =======================
jwt.secret=CHANGE_ME_SECRET_KEY
jwt.expiration-ms=3600000

# =======================
# MAIL CONFIG (DEFAULTS)
# =======================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=example@gmail.com           # placeholder
spring.mail.password=examplepassword123          # placeholder
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =======================
# SERVER
# =======================
server.port=8080
